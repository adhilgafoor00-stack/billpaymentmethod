<!DOCTYPE html>
<html>

<head>
    <title>Mobile Recharge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <ul class="flashes" style="list-style-type: none; padding: 0; text-align: center;">
        {% for category, message in messages %}
        <li class="{{ category }}"
            style="color: {{ 'red' if category == 'error' else 'green' }}; font-weight: bold; margin-bottom: 10px;">{{
            message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    <div class="form-box">

        <h2>Mobile Recharge</h2>

        <form method="POST" action="{{ url_for('recharge') }}" style="width: 100%;">
            <input type="text" name="mobile" placeholder="Mobile Number" required>

            <select name="operator">
                <option>Jio</option>
                <option>Airtel</option>
                <option>VI</option>
                <option>BSNL</option>
            </select>

            <input type="number" name="amount" placeholder="Amount" min="1" required>

            <button type="submit" style="margin-top: 10px;">Recharge</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('dashboard') }}" style="color: #00f2fe; text-decoration: none;">Back to Dashboard</a>
        </div>

    </div>

</body>

</html>
