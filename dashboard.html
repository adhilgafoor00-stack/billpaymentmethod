<!DOCTYPE html>
<html>
<head>
<title>Easy Pay - Personal Dashboard</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
height:100vh;

background: linear-gradient(-45deg,#ff6a00,#ee0979,#00c6ff,#0072ff);
background-size:400% 400%;
animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
color:white;
}

.logo{
font-size:30px;
font-weight:bold;
letter-spacing:2px;
}

.profile{
font-size:16px;
}

/* HERO TITLE */

.hero{
text-align:center;
margin-top:10px;
}

.main-title{
font-size:60px;
font-weight:bold;
background: linear-gradient(45deg,#ffffff,#ffd700,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation: glow 2s infinite alternate;
}

@keyframes glow{
0%{text-shadow:0 0 10px rgba(255,255,255,0.3);}
100%{text-shadow:0 0 25px rgba(255,255,255,0.9);}
}

.tagline{
color:white;
font-size:18px;
}

/* BALANCE CARD */

.balance-card{
width:300px;
margin:30px auto;
background:white;
padding:20px;
border-radius:12px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
animation: slideUp 1s ease;
}

.balance-card h3{
margin:0;
color:#555;
}

.balance{
font-size:30px;
font-weight:bold;
margin-top:10px;
color:#0072ff;
}

@keyframes slideUp{
from{
transform:translateY(40px);
opacity:0;
}

to{
transform:translateY(0);
opacity:1;
}
}

/* MENU */

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
width:330px;
margin:20px auto;
}

.menu a{
text-decoration:none;
background:white;
padding:20px;
text-align:center;
border-radius:12px;
font-weight:bold;
color:#333;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

/* HOVER EFFECT */

.menu a:hover{
transform:scale(1.08);
background:linear-gradient(45deg,#00c6ff,#0072ff);
color:white;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">Easy Pay</div>

<div class="profile">Welcome, User 👤</div>

</div>

<!-- HERO -->

<div class="hero">

<h1 class="main-title">Easy Pay</h1>

<p class="tagline">Your Personal Smart Payment System</p>

</div>

<!-- BALANCE CARD -->

<div class="balance-card">

<h3>Available Balance</h3>

<div class="balance">₹5,000</div>

</div>

<!-- MENU OPTIONS -->

<div class="menu">

<a href="paybill.html">⚡ Pay Bill</a>

<a href="recharge.html">📱 Recharge</a>

<a href="history.html">📜 History</a>

<a href="contact.html">☎ Support</a>

<a href="scanpay.html">📷 Scan & Pay</a>

</div>

</body>
</html>
